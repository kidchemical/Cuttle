apply plugin: 'com.android.application'

def secretsRoot = file("${rootProject.projectDir}/../../../.cuttle/personal/secrets").canonicalFile
def signingFile = { String value ->
    def key = file(value).canonicalFile
    if (!key.toPath().startsWith(secretsRoot.toPath()) || !key.isFile()) {
        throw new GradleException("Android signing keystore must be an existing file under .cuttle/personal/secrets")
    }
    return key
}
def debugKey = System.getenv("CUTTLE_ANDROID_DEBUG_KEYSTORE")
def releaseKey = System.getenv("CUTTLE_ANDROID_KEYSTORE")
def releaseStorePassword = System.getenv("CUTTLE_ANDROID_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("CUTTLE_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("CUTTLE_ANDROID_KEY_PASSWORD")
def releaseVersion = System.getenv("CUTTLE_ANDROID_VERSION_CODE")
if (releaseVersion && (!releaseVersion.isInteger() || releaseVersion.toLong() <= 0
    || releaseVersion.toLong() > 2100000000)) {
    throw new GradleException("CUTTLE_ANDROID_VERSION_CODE must be an integer between 1 and 2100000000")
}
def releaseReady = releaseKey && releaseStorePassword && releaseKeyAlias && releaseKeyPassword


android {
    namespace "com.cuttle.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cuttle.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (releaseVersion ? releaseVersion.toInteger() : ((int) (System.currentTimeMillis() / 1000L)))
        versionName (System.getenv("CUTTLE_ANDROID_VERSION_NAME") ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Signing is explicitly configured; keys and passwords are never committed.
    if (debugKey) {
        signingConfigs.debug {
            storeFile signingFile(debugKey)
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    if (releaseReady) {
        signingConfigs {
            cuttleRelease {
                storeFile signingFile(releaseKey)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        buildTypes.release.signingConfig signingConfigs.cuttleRelease
    }

}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:okhttp-sse:4.12.0"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    testImplementation "com.squareup.okhttp3:okhttp-tls:4.12.0"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.doFirst {
            if (!releaseReady || !releaseVersion || !releaseVersion.isInteger()
                || releaseVersion.toLong() <= 0 || releaseVersion.toLong() > 2100000000
                || releaseKeyAlias == "androiddebugkey") {
                throw new GradleException("Release builds require explicit CUTTLE_ANDROID_KEYSTORE, STORE_PASSWORD, " +
                    "KEY_ALIAS, KEY_PASSWORD and VERSION_CODE (all prefixed CUTTLE_ANDROID_); use a private release key.")
            }
        }
    }
}

def repoRoot = file("${rootProject.projectDir}/../../..")
def srcDir = new File(repoRoot, "src")
// Resolve only when a build task runs, so IDE sync does not require Python.
// Never use PATH Python: the hash/publish module needs the Cuttle venv deps.
def pythonExec = {
    def venvPath = File.separator == '\\' ? ".venv/Scripts/python.exe" : ".venv/bin/python"
    def venvPy = new File(repoRoot, venvPath)
    if (!venvPy.isFile()) {
        throw new GradleException("Cuttle Python venv missing: ${venvPy}. " +
            "Create .venv at the repository root and install src/requirements/requirements.txt.")
    }
    return venvPy.absolutePath
}

tasks.register("writeCuttleShellHash", Exec) {
    workingDir repoRoot
    environment "PYTHONPATH", srcDir.absolutePath
    doFirst {
        commandLine pythonExec(), "-m", "api.mobile_android_update", "write-hash"
    }
}

tasks.named("preBuild").configure {
    dependsOn "writeCuttleShellHash"
}

android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name != "debug") {
        return
    }
    variant.assembleProvider.configure {
        doLast {
            // Publication verifies with the SDK and JDK this build already used.
            // A refused publication leaves the built APK in place; it only stays unserved.
            def result = exec {
                workingDir repoRoot
                environment "PYTHONPATH", srcDir.absolutePath
                environment "ANDROID_HOME", android.sdkDirectory.absolutePath
                environment "JAVA_HOME", System.getProperty("java.home")
                commandLine pythonExec(), "-m", "api.mobile_android_update", "publish"
                ignoreExitValue true
            }
            if (result.exitValue != 0) {
                logger.warn("Cuttle LAN update was not published (see message above). " +
                    "The APK built successfully but phones will not be offered it.")
            }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
