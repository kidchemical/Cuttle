[pytest]
testpaths = src/tests
pythonpath = src
# SAFE DEFAULT: Exclude tests that control mouse, keyboard, windows, or launch apps.
addopts = --timeout=90 --ignore=src/tests/e2e --ignore=src/tests/unit/test_input_tools.py --ignore=src/tests/unit/test_window_focus.py --ignore=src/tests/unit/test_process_tools.py --ignore=src/tests/unit/test_window_tools.py --ignore=src/tests/unit/test_screenshot_tools.py --ignore=src/tests/unit/test_ocr_tools.py --ignore=src/tests/unit/test_windows_tools.py --ignore=src/tests/test_claude_usage.py --ignore=src/tests/test_mcp_conversion.py --ignore=src/tests/test_mcp_install.py --ignore=src/tests/unit/test_api_key.py --ignore=src/tests/unit/test_openai_connection.py --ignore=src/tests/unit/test_security.py --ignore=src/tests/unit/test_security_standalone.py --ignore=src/tests/test_hello_world_parallelization.py
asyncio_mode = strict
markers =
    unsafe: Tests that control mouse, keyboard, windows, or launch applications
    integration: Tests that start in-process services or hit real I/O (may be slower)
