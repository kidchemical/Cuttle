name: Feature request
description: Suggest a capability or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you have tried
  - type: checkboxes
    id: extension
    attributes:
      label: Could this be an extension instead of a core change?
      description: Many features fit as a project command, action, or agent adapter. See docs/architecture/extension-boundaries.md.
      options:
        - label: I checked whether this fits as a project command, action, or adapter
