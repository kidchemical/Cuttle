name: Desktop smoke
on:
  pull_request:
    paths:
      - 'electron/**'
      - 'src/web/**'
      - 'src/api/device_workers/**'
      - '.github/workflows/desktop-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/web/**'
      - 'src/api/device_workers/**'
      - '.github/workflows/desktop-smoke.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Real Host and Client shell (Linux)
        if: runner.os == 'Linux'
        # Only the isolated test processes disable sandboxing under Xvfb.
        # Production launchers retain their sandbox policy.
        run: |
          xvfb-run -a npm run smoke:host -- --no-sandbox --ozone-platform=x11
          xvfb-run -a npm run smoke:client -- --no-sandbox --ozone-platform=x11
      - name: Real Host and Client shell (Windows)
        if: runner.os == 'Windows'
        run: |
          npm run smoke:host
          npm run smoke:client
      - name: Build unpacked native desktop
        run: npx electron-builder --dir --publish never
