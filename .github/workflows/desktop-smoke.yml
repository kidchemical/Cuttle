name: Desktop smoke
# Merge gate: runs on every PR (no path filter, so it can be a required
# check) and on main. Release calls it before publishing artifacts.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      packaged:
        description: Also build, install and E2E the packaged Host
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  packaged-host:
    # Release runs the packaged build itself (with uploads).
    # toJSON keeps the comparison type-exact: on push/PR inputs is empty (null),
    # and null == false under GitHub's loose equality.
    if: ${{ toJSON(inputs.packaged) != 'false' }}
    uses: ./.github/workflows/packaged-host.yml
    with:
      upload: false
    secrets: inherit
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      # The Host shell resolves Python from the checkout's .venv before it
      # opens the window (the smoke stubs the daemon itself); the runner's
      # tool-cache Python is not on that search path.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m venv .venv
        working-directory: .
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Install isolated desktop test window manager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbox x11-utils
      - name: Real Host and Client shell (Linux)
        if: runner.os == 'Linux'
        # Only the isolated test processes disable sandboxing under Xvfb.
        # Production launchers retain their sandbox policy.
        run: xvfb-run -a bash tests/smoke-linux.sh
      - name: Real Host and Client shell (Windows)
        if: runner.os == 'Windows'
        run: |
          npm run smoke:host
          npm run smoke:client
      - name: Build unpacked native desktop
        run: npx electron-builder --dir --publish never
