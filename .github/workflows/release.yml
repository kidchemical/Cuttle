name: Release
# Tag-driven release artifacts: push a `v<semver>` tag that matches
# electron/package.json. Every gate (Quality, Desktop smoke, packaged Host
# E2E on Windows + Linux) must pass before a DRAFT GitHub Release is created
# with the installers and a combined SHA256SUMS. A maintainer reviews and
# publishes the draft; nothing is published automatically.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches electron/package.json
        run: |
          want="v$(node -p "require('./electron/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match electron/package.json ($want)" >&2
            exit 1
          fi
  quality:
    needs: version
    uses: ./.github/workflows/quality.yml
  desktop-smoke:
    needs: version
    uses: ./.github/workflows/desktop-smoke.yml
    with:
      packaged: false
  packaged:
    needs: version
    uses: ./.github/workflows/packaged-host.yml
    with:
      upload: true
    secrets: inherit
  draft-release:
    needs: [quality, desktop-smoke, packaged]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cuttle-*
          path: artifacts
          merge-multiple: true
      - name: Combined checksums
        working-directory: artifacts
        run: |
          rm -f SHA256SUMS-*.txt
          sha256sum *.AppImage *.exe | tee SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Cuttle $GITHUB_REF_NAME" \
            --notes "Draft built from $GITHUB_SHA. Verify downloads against SHA256SUMS. Windows artifacts are Authenticode-signed only when signing secrets are configured." \
            artifacts/*
