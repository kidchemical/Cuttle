name: Quality
on:
  # PR branches run once (pull_request); push covers main after merge.
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Full history: scanner-exception tests verify reviewed historical blobs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m venv .venv
      - run: ${{ matrix.python }} -m pip install -r src/requirements/requirements.txt -r src/requirements/requirements-dev.txt
      - run: git submodule status
      # tmp_path must sit outside the checkout: git-aware tests treat any
      # directory inside the repo as part of it. pytest creates --basetemp but
      # not its parents; runner.temp always exists.
      - name: Unit and ownership suites (Node available)
        run: ${{ matrix.python }} -m pytest src/tests/ --basetemp="${{ runner.temp }}/pytest"
  browser:
    runs-on: ubuntu-latest
    env:
      CUTTLE_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r src/requirements/requirements.txt -r src/requirements/requirements-dev.txt
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Isolated Chromium chat rendering
        run: .venv/bin/python -m pytest src/tests/e2e/test_chat_action_card_render.py src/tests/e2e/test_chat_action_cards_controller.py src/tests/e2e/test_chat_badge_identity.py --basetemp="${{ runner.temp }}/browser"
  android:
    runs-on: ubuntu-latest
    env:
      CUTTLE_MOBILE_AUTO_REBUILD: '0'
      CUTTLE_ANDROID_PUBLISH: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The action's default package list still names the removed SDK `tools` package.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r src/requirements/requirements.txt
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run check
        working-directory: apps/mobile
      - run: npm run sync:android
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
        working-directory: apps/mobile/android
