# Monthly, grouped version updates so a solo maintainer gets a few PRs, not dozens.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /src/requirements
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /electron
    schedule:
      interval: monthly
    groups:
      electron:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: monthly
    groups:
      mobile:
        patterns: ["*"]
    open-pull-requests-limit: 3
