id: claude
label: Claude Code
slash: /claude
requires_cloud: true
auth_command: claude auth login
sticky: true
# Empty — unpinned turns omit --model so the Claude CLI default wins.
default_model: ""
models:
  - haiku
  - sonnet
  - opus
  - fable
  - claude-opus-5-5
  - claude-sonnet-5-5
  - claude-fable-5-1
# Offline snapshot; native SDK initialization supplies account/provider-specific rows.
supports_model_pin: true
supports_effort: true
efforts: [low, medium, high, xhigh, max]
model_efforts:
  haiku: []
  sonnet: [low, medium, high, xhigh, max]
  opus: [low, medium, high, xhigh, max]
  fable: [low, medium, high, xhigh, max]
  claude-opus-5-5: [low, medium, high, xhigh, max]
  claude-sonnet-5-5: [low, medium, high, xhigh, max]
  claude-fable-5-1: [low, medium, high, xhigh, max]
pricing_source: models_dev
pricing_providers: [anthropic]
resume: true
capabilities_inject: once_per_resume
env_profile: either
activity: heartbeat
hint: Run Anthropic Claude Code CLI (`claude -p`) with per-chat resume (Auto/Cloud)
missing_cli_hint: >-
  Install Claude Code (`npm i -g @anthropic-ai/claude-code` or the native
  installer) and ensure `claude` is on PATH. Authenticate with
  `claude auth login`.
install_hint: >-
  Install `@anthropic-ai/claude-code` (or the native build), then
  `claude auth login`.
executable_names:
  - claude
notes: >-
  Native `claude -p --output-format json` against the project cwd.
  Resume via `--resume` + claude_cli_session_store. Compact via `/compact`.
