id: claude
label: Claude Code
slash: /claude
requires_cloud: true
auth_command: claude auth login
sticky: true
# Empty — unpinned turns omit --model so the Claude CLI default wins.
default_model: ""
# Snapshot from `claude 2.1.289` → SDK `initialize` (`/claude model refresh`).
# The palette reads the installed CLI live; these rows are the offline fallback.
models:
  - opus
  - sonnet
  - fable
  - haiku
  - claude-opus-5-5
  - claude-sonnet-5-5
  - claude-fable-5-1
  - claude-sonnet-4-6
supports_model_pin: true
supports_effort: true
# `--effort` levels for the CLI default model (unpinned turns).
efforts: [low, medium, high, xhigh, max]
model_efforts:
  opus: [low, medium, high, xhigh, max]
  sonnet: [low, medium, high, xhigh, max]
  fable: [low, medium, high, xhigh, max]
  haiku: []
  claude-opus-5-5: [low, medium, high, xhigh, max]
  claude-sonnet-5-5: [low, medium, high, xhigh, max]
  claude-fable-5-1: [low, medium, high, xhigh, max]
  claude-sonnet-4-6: [low, medium, high, max]
pricing_source: models_dev
pricing_providers: [anthropic]
resume: true
capabilities_inject: once_per_resume
env_profile: either
activity: jsonl
hint: Run Anthropic Claude Code CLI (`claude -p`) with per-chat resume
missing_cli_hint: >-
  Install Claude Code (`npm i -g @anthropic-ai/claude-code` or the native
  installer) and ensure `claude` is on PATH. Authenticate with
  `claude auth login`.
install_hint: >-
  Install `@anthropic-ai/claude-code` (or the native build), then
  `claude auth login`.
executable_names:
  - claude
notes: >-
  Native `claude -p --output-format stream-json --verbose --include-partial-messages` against the project cwd.
  Resume via `--resume` + claude_cli_session_store. Compact via `/compact`.
  Per-chat `/claude model …` / `/claude effort …` pins map to `--model` /
  `--effort`; refresh via `/claude model refresh`.
