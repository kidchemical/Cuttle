id: antigravity
label: Antigravity CLI
slash: /antigravity
icon: "▲"
requires_cloud: true
auth_command: agy login
sticky: true
default_model: ""
models:
  - gemini-3.7-flash-high
  - gemini-3.7-flash-medium
  - gemini-3.6-flash-high
  - gemini-3.6-flash-medium
  - gemini-3.5-flash-medium
  - gemini-3.1-pro-high
  - claude-sonnet-4-6
pricing_source: models_dev
pricing_providers: [google, anthropic]
resume: true
capabilities_inject: once_per_resume
env_profile: native
activity: jsonl
hint: Run Google Antigravity CLI (`agy`) headlessly with per-chat resume
install_hint: >-
  Install the official Antigravity CLI yourself and put `agy` on PATH. Cuttle
  discovers installed CLIs; it does not install them. Authentication requires a Google sign-in via `agy` or a configured GEMINI_API_KEY provider.
missing_cli_hint: >-
  Install from https://antigravity.google/docs/cli/install/ and ensure `agy` is available.
executable_names:
  - agy
schema_version: 1
notes: Official Google Antigravity CLI connector; structured headless JSON output.
