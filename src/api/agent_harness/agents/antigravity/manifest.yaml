id: antigravity
label: Antigravity CLI
slash: /antigravity
requires_cloud: true
sticky: true
default_model: ""
models:
  - gemini-3.7-flash-high
  - gemini-3.7-flash-medium
  - gemini-3.6-flash-high
  - gemini-3.6-flash-medium
  - gemini-3.5-flash-medium
  - gemini-3.1-pro-high
  - claude-sonnet-4-6
pricing_source: models_dev
pricing_providers: [google, anthropic]
resume: true
capabilities_inject: once_per_resume
env_profile: native
activity: heartbeat
hint: Run Google Antigravity CLI (`agy`) headlessly with per-chat resume
install_hint: >-
  Cuttle can install the official Antigravity CLI automatically. Authentication
  still requires a Google sign-in via `agy` or a configured GEMINI_API_KEY provider.
missing_cli_hint: >-
  Install from https://antigravity.google/docs/cli/install/ and ensure `agy` is available.
install_kind: script_url
install_url_windows: https://antigravity.google/cli/install.ps1
install_url_posix: https://antigravity.google/cli/install.sh
executable_names:
  - agy
auto_install: true
schema_version: 1
notes: Official Google Antigravity CLI connector; structured headless JSON output.
