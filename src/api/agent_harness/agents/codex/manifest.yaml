id: codex
label: Codex
slash: /codex
requires_cloud: true
sticky: true
default_model: ""
smoke_model: gpt-5.5
# Snapshot from `codex-cli 0.156.1` → `codex debug models`. The model palette
# reads the installed CLI live; these entries are the verified offline fallback.
models:
  - gpt-6-astra
  - gpt-6-sol
  - gpt-6-luna
  - gpt-reserve
  - gpt-5.6-sol
  - gpt-5.6-terra
  - gpt-5.6-luna
  - gpt-5.5
  - codex-auto-review
# Union of levels verified for at least one model below. Per-model restrictions
# are in model_efforts; `minimal` is not supported by this CLI catalog.
efforts:
  - low
  - medium
  - high
  - xhigh
  - max
  - ultra
model_efforts:
  gpt-6-astra: [low, medium, high, xhigh, max, ultra]
  gpt-6-sol: [low, medium, high, xhigh, max, ultra]
  gpt-6-luna: [low, medium, high, xhigh, max]
  gpt-reserve: [low, medium, high, xhigh, max]
  gpt-5.6-sol: [low, medium, high, xhigh, max, ultra]
  gpt-5.6-terra: [low, medium, high, xhigh, max, ultra]
  gpt-5.6-luna: [low, medium, high, xhigh, max]
  gpt-5.5: [low, medium, high, xhigh]
  codex-auto-review: [low, medium, high, xhigh, max]
# /cost: `codex debug models` carries no prices — OpenAI list rates via models.dev.
pricing_source: models_dev
pricing_providers: [openai]
resume: true
capabilities_inject: once_per_resume
env_profile: native
activity: heartbeat
hint: Run OpenAI Codex CLI (`codex exec`) with per-chat resume (Auto/Cloud)
missing_cli_hint: >-
  Install OpenAI Codex and ensure `codex` is on PATH (or set `CODEX_CLI_PATH`).
install_hint: >-
  Install the Codex CLI from OpenAI, then run `codex login` (ChatGPT account).
  Optional: set `CODEX_CLI_PATH` if the binary is not on PATH.
executable_names:
  - codex
auto_install: false
notes: Bundled harness connector wrapping scripts.utilities.codex_cli_tool.
