[pytest]
# SAFE DEFAULT: Exclude tests that control mouse, keyboard, windows, or launch apps.
# Also exclude tests that require async setup, network, or have import issues (run separately to fix).
addopts = --timeout=90 --ignore=tests/unit/test_input_tools.py --ignore=tests/unit/test_window_focus.py --ignore=tests/unit/test_process_tools.py --ignore=tests/unit/test_window_tools.py --ignore=tests/unit/test_screenshot_tools.py --ignore=tests/unit/test_ocr_tools.py --ignore=tests/unit/test_windows_tools.py --ignore=tests/test_claude_usage.py --ignore=tests/test_mcp_conversion.py --ignore=tests/test_mcp_install.py --ignore=tests/unit/test_api_key.py --ignore=tests/unit/test_openai_connection.py --ignore=tests/unit/test_security.py --ignore=tests/unit/test_security_standalone.py --ignore=tests/test_hello_world_parallelization.py
asyncio_mode = strict
markers =
    unsafe: Tests that control mouse, keyboard, windows, or launch applications
    integration: Tests that start in-process services or hit real I/O (may be slower)
