[pytest]
# Unsafe / network / retired-module exclusions live in tests/conftest.py
# (collect_ignore) so they apply from any cwd and either pytest.ini.
addopts = --timeout=90
asyncio_mode = strict
markers =
    unsafe: Tests that control mouse, keyboard, windows, or launch applications
    integration: Tests that start in-process services or hit real I/O (may be slower)
