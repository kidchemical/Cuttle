<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Reports - Cuttle</title>
    <link rel="stylesheet" href="/css/ui_boot.css?v=20260927blendTarget">
    <script src="/js/ui_boot.js?v=20260926safeArea"></script>
    <link rel="stylesheet" href="/css/shared_navigation.css?v=20260926lightBg">
    <link rel="stylesheet" href="/css/compact_page.css">
    <style>
        body.compact-shell-page[data-page="query-reports"] {
            padding: 0;
        }
        .qr-page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 10px 12px 16px;
        }
        .search-section, .results-section {
            background: var(--section-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            box-shadow: none;
            backdrop-filter: none;
        }
        .search-controls {
            display: flex;
            gap: 6px;
            margin: 0;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-input, .filter-select {
            flex: 1;
            min-width: 140px;
            padding: 6px 9px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-tertiary, var(--stat-bg));
            color: var(--text-primary);
            font-size: 0.8rem;
        }
        .search-input:focus, .filter-select:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .search-btn, .clear-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .search-btn { background: var(--accent-color); color: var(--text-inverse); }
        .clear-btn { background: var(--border-color); color: var(--text-primary); }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .results-count { color: var(--text-secondary); font-size: 0.78rem; }
        .sort-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .sort-select {
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-tertiary, var(--stat-bg));
            color: var(--text-primary);
            font-size: 0.75rem;
        }
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 8px;
        }
        .report-card {
            background: var(--stat-bg, var(--bg-tertiary));
            border-radius: 7px;
            padding: 9px 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .report-card:hover {
            border-color: var(--accent-color);
            transform: none;
            box-shadow: none;
        }
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 6px;
        }
        .report-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .report-date {
            color: var(--text-secondary);
            font-size: 0.68rem;
            white-space: nowrap;
        }
        .report-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
            font-size: 0.7rem;
        }
        .meta-item { display: flex; flex-direction: column; gap: 1px; }
        .meta-label {
            font-size: 0.62rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .meta-value { font-weight: 600; color: var(--text-primary); }
        .report-preview {
            color: var(--text-secondary);
            font-size: 0.72rem;
            line-height: 1.35;
            margin-bottom: 7px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .report-actions { display: flex; gap: 5px; }
        .action-btn {
            padding: 3px 8px;
            border: none;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .view-btn { background: var(--accent-color); color: var(--text-inverse); }
        .download-btn { background: var(--border-color); color: var(--text-primary); }
        .loading, .no-results, .error {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 4px 8px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: var(--section-bg);
            color: var(--text-primary);
            font-size: 0.72rem;
            cursor: pointer;
        }
        .pagination button.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--text-inverse);
        }
        @media (max-width: 640px) {
            .reports-grid { grid-template-columns: 1fr; }
            .search-controls { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body class="compact-shell-page" data-page="query-reports">
    <script>
        (function () {
            if (window.CuttleUiBoot) return;
            var t = localStorage.getItem('theme') || 'dark';
            document.body.classList.remove('dark-mode', 'midnight-mode', 'light-mode');
            document.body.classList.add(t === 'light' ? 'light-mode' : (t === 'midnight' ? 'midnight-mode' : 'dark-mode'));
        })();
    </script>
    <div class="qr-page">
        <div class="compact-page-title">
            <h1>Query Reports</h1>
            <p>Search and open past AI query logs</p>
        </div>

        <div class="search-section">
            <div class="search-controls">
                <input type="text" class="search-input" id="searchInput" placeholder="Search by content, date, or ID…">
                <select class="filter-select" id="dateFilter">
                    <option value="">All Time</option>
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                    <option value="year">This Year</option>
                </select>
                <select class="filter-select" id="typeFilter">
                    <option value="">All Types</option>
                    <option value="query">Query Reports</option>
                    <option value="data">Data Reports</option>
                    <option value="budget">Budget Reports</option>
                    <option value="test">Test Reports</option>
                    <option value="launch">Launch Reports</option>
                </select>
                <button class="search-btn" onclick="searchReports()">Search</button>
                <button class="clear-btn" onclick="clearSearch()">Clear</button>
            </div>
        </div>

        <div class="results-section">
            <div class="results-header">
                <div class="results-count" id="resultsCount">Loading reports...</div>
                <div class="sort-controls">
                    <label for="sortSelect">Sort</label>
                    <select class="sort-select" id="sortSelect" onchange="sortReports()">
                        <option value="date-desc">Newest</option>
                        <option value="date-asc">Oldest</option>
                        <option value="name-asc">Name A–Z</option>
                        <option value="name-desc">Name Z–A</option>
                        <option value="size-desc">Largest</option>
                        <option value="size-asc">Smallest</option>
                    </select>
                </div>
            </div>
            
            <div id="reportsContainer">
                <div class="loading">Loading query reports…</div>
            </div>
            
            <div class="pagination" id="pagination" style="display: none;"></div>
        </div>
    </div>

    <script src="/js/background_effect_blend.js"></script>
    <script src="/js/shared_navigation.js"></script>
    <script>
        // Global state
        let allReports = [];
        let filteredReports = [];
        let currentReportPage = 1;
        const reportsPerPage = 12;

        // Initialize theme and load reports
        document.addEventListener('DOMContentLoaded', function() {
            if (window.initializeTheme) {
                window.initializeTheme();
            }
            loadReports();
            
            // Add enter key support for search
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchReports();
                }
            });
        });

        async function loadReports() {
            try {
                const response = await fetch('/api/query-reports');
                const data = await response.json();
                
                if (data.success) {
                    allReports = data.reports || [];
                    filteredReports = [...allReports];
                    displayReports();
                    updateResultsCount();
                } else {
                    showError('Failed to load reports: ' + data.error);
                }
            } catch (error) {
                console.error('Error loading reports:', error);
                showError('Network error loading reports');
            }
        }

        function displayReports() {
            const container = document.getElementById('reportsContainer');
            const startIndex = (currentReportPage - 1) * reportsPerPage;
            const endIndex = startIndex + reportsPerPage;
            const pageReports = filteredReports.slice(startIndex, endIndex);

            if (pageReports.length === 0) {
                container.innerHTML = '<div class="no-results">No reports found matching your criteria.</div>';
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            const reportsHTML = pageReports.map(report => `
                <div class="report-card" onclick="openReport('${report.filename}')">
                    <div class="report-header">
                        <h3 class="report-title">${report.title || report.filename}</h3>
                        <div class="report-date">${formatDate(report.date)}</div>
                    </div>
                    <div class="report-meta">
                        <div class="meta-item">
                            <div class="meta-label">Type</div>
                            <div class="meta-value">${getReportType(report.filename)}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Size</div>
                            <div class="meta-value">${formatFileSize(report.size)}</div>
                        </div>
                    </div>
                    <div class="report-preview">
                        ${report.preview || 'No preview available'}
                    </div>
                    <div class="report-actions">
                        <a href="/logs/${report.filename}" target="_blank" class="action-btn view-btn" onclick="event.stopPropagation()">
                            View
                        </a>
                        <a href="/logs/${report.filename}" download class="action-btn download-btn" onclick="event.stopPropagation()">
                            Download
                        </a>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="reports-grid">${reportsHTML}</div>`;
            updatePagination();
        }

        function searchReports() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const dateFilter = document.getElementById('dateFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;

            filteredReports = allReports.filter(report => {
                // Text search
                const matchesSearch = !searchTerm || 
                    report.filename.toLowerCase().includes(searchTerm) ||
                    (report.title && report.title.toLowerCase().includes(searchTerm)) ||
                    (report.preview && report.preview.toLowerCase().includes(searchTerm));

                // Date filter
                const matchesDate = !dateFilter || matchesDateFilter(report.date, dateFilter);

                // Type filter
                const matchesType = !typeFilter || getReportType(report.filename).toLowerCase().includes(typeFilter);

                return matchesSearch && matchesDate && matchesType;
            });

            currentReportPage = 1;
            displayReports();
            updateResultsCount();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('dateFilter').value = '';
            document.getElementById('typeFilter').value = '';
            filteredReports = [...allReports];
            currentReportPage = 1;
            displayReports();
            updateResultsCount();
        }

        function sortReports() {
            const sortBy = document.getElementById('sortSelect').value;
            
            filteredReports.sort((a, b) => {
                switch (sortBy) {
                    case 'date-desc':
                        return new Date(b.date) - new Date(a.date);
                    case 'date-asc':
                        return new Date(a.date) - new Date(b.date);
                    case 'name-asc':
                        return a.filename.localeCompare(b.filename);
                    case 'name-desc':
                        return b.filename.localeCompare(a.filename);
                    case 'size-desc':
                        return (b.size || 0) - (a.size || 0);
                    case 'size-asc':
                        return (a.size || 0) - (b.size || 0);
                    default:
                        return 0;
                }
            });

            currentReportPage = 1;
            displayReports();
        }

        function updateResultsCount() {
            const count = filteredReports.length;
            const total = allReports.length;
            document.getElementById('resultsCount').textContent = 
                `Showing ${count} of ${total} reports`;
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredReports.length / reportsPerPage);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }

            pagination.style.display = 'flex';
            
            let paginationHTML = '';
            
            // Previous button
            paginationHTML += `
                <button class="page-btn" ${currentReportPage === 1 ? 'disabled' : ''} 
                        onclick="changePage(${currentReportPage - 1})">
                    ← Previous
                </button>
            `;
            
            // Page numbers
            const startPage = Math.max(1, currentReportPage - 2);
            const endPage = Math.min(totalPages, currentReportPage + 2);
            
            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <button class="page-btn ${i === currentReportPage ? 'active' : ''}" 
                            onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }
            
            // Next button
            paginationHTML += `
                <button class="page-btn" ${currentReportPage === totalPages ? 'disabled' : ''} 
                        onclick="changePage(${currentReportPage + 1})">
                    Next →
                </button>
            `;
            
            pagination.innerHTML = paginationHTML;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredReports.length / reportsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentReportPage = page;
                displayReports();
            }
        }

        function openReport(filename) {
            window.open(`/logs/${filename}`, '_blank');
        }

        function formatDate(dateString) {
            if (!dateString) return 'Unknown';
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function formatFileSize(bytes) {
            if (!bytes) return 'Unknown';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }

        function getReportType(filename) {
            if (filename.includes('query_report')) return 'Query Report';
            if (filename.includes('data_report')) return 'Data Report';
            if (filename.includes('budget_report')) return 'Budget Report';
            if (filename.includes('test_report')) return 'Test Report';
            if (filename.includes('launch_report')) return 'Launch Report';
            return 'Report';
        }

        function matchesDateFilter(dateString, filter) {
            if (!dateString) return false;
            const date = new Date(dateString);
            const now = new Date();
            
            switch (filter) {
                case 'today':
                    return date.toDateString() === now.toDateString();
                case 'week':
                    const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    return date >= weekAgo;
                case 'month':
                    const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                    return date >= monthAgo;
                case 'year':
                    const yearAgo = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
                    return date >= yearAgo;
                default:
                    return true;
            }
        }

        function showError(message) {
            document.getElementById('reportsContainer').innerHTML =
                `<div class="no-results">${message}</div>`;
        }
    </script>
</body>
</html>
