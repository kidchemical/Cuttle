<!DOCTYPE html>
<!--
  Cuttle error page — one self-contained file (no external CSS/JS/images), so it
  renders when the Cuttle server itself is unreachable.

  Data, first match wins:
    1. Server-rendered: api.error_pages replaces the CUTTLE_ERROR_DATA marker below
       with JSON {kind:"http", status, name, message, path, method, time, request_id}.
    2. Query string (Electron did-fail-load, Android WebView errors):
       ?kind=network&code=ERR_CONNECTION_REFUSED&errno=-102&url=…&host=…&platform=electron|android&attempt=N
  Owners: Flask api.error_pages; Electron electron/main.js (errorPageUrl);
  Android MainActivity.showErrorPage (copied into the APK by apps/mobile/vite.config.js).

  Mascot: the "Oops!" squid logo, inline as two 640px WebP data URIs (kept
  inline so offline clients have it): .err-logo--light is the original art,
  .err-logo--dark has the navy "Oops!" text recolored light for dark themes.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Cuttle · Error</title>
<style>
:root {
    --bg: #0b0f17; --bg2: #151a2b; --panel: rgba(255,255,255,.045); --border: rgba(255,255,255,.1);
    --text: #e6eaf2; --muted: #95a0b5; --accent: #a78bfa; --accent2: #f472b6; --bad: #f87171;
    color-scheme: dark;
}
html.light {
    --bg: #f5f3fb; --bg2: #e9e4f7; --panel: rgba(0,0,0,.035); --border: rgba(0,0,0,.1);
    --text: #1d2030; --muted: #5d6478; --accent: #7c3aed; --accent2: #db2777; --bad: #dc2626;
    color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background: radial-gradient(1200px 700px at 50% -10%, var(--bg2), var(--bg) 70%) fixed;
    color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { width: 100%; max-width: 520px; text-align: center; }
.err-mascot { width: min(320px, 80vw); margin: 0 auto 14px; animation: drift 6s ease-in-out infinite; }
.err-logo { display: block; width: 100%; height: auto; }
.err-logo--light, html.light .err-logo--dark { display: none; }
html.light .err-logo--light { display: block; }
@keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .err-mascot { animation: none; } }
.err-code {
    margin: 0; font-size: 64px; line-height: 1; font-weight: 800; letter-spacing: -.02em;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-variant-numeric: tabular-nums;
}
.err-code.is-text { font-size: 30px; letter-spacing: 0; word-break: break-word; }
h1 { margin: 10px 0 6px; font-size: 22px; font-weight: 700; }
.err-lead { margin: 0 auto; max-width: 440px; color: var(--muted); }
.err-lead code { color: var(--text); font-size: .92em; word-break: break-all; }
.err-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 22px 0 6px; }
button {
    min-height: 40px; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
}
button:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
button.primary { background: linear-gradient(120deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err-retry { min-height: 20px; margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
details {
    margin: 18px auto 0; text-align: left; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel); overflow: hidden;
}
summary { padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
summary:hover { color: var(--text); }
dl { margin: 0; padding: 4px 14px 12px; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 12.5px; }
dt { color: var(--muted); }
dd { margin: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; word-break: break-all; }
.err-copy { margin: 0 14px 12px; min-height: 30px; padding: 4px 12px; font-size: 12px; }
.err-foot { margin-top: 16px; font-size: 12px; color: var(--muted); opacity: .8; }
@media (max-width: 420px) { .err-code { font-size: 52px; } .err-mascot { width: 240px; } }
</style>
<script>
try { if ((localStorage.getItem('theme') || '') === 'light') document.documentElement.classList.add('light'); } catch (_) {}
</script>
</head>

        413: ['Too large', 'That upload is bigger than Cuttle accepts.'],
        429: ['Slow down', 'Too many requests in a short time. Wait a moment and retry.'],
        500: ['Cuttle hit an error', 'Something broke while handling this page. The Flask log has the full error under the request id below.'],
        502: ['Bad gateway', 'Something between you and Cuttle returned a bad answer.'],
        503: ['Cuttle is busy', 'Cuttle can’t handle this right now, often during a restart. Retry in a moment.'],
        504: ['Gateway timeout', 'Cuttle took too long to answer.'],
    };
    var NET = {
        ERR_CONNECTION_REFUSED: ['Cuttle isn’t answering', 'Nothing is listening at {host}. Cuttle may be starting, restarting or stopped.', true],
        ERR_CONNECTION_RESET: ['Connection dropped', 'The connection to {host} was cut off, often while Cuttle restarts.', true],
        ERR_CONNECTION_CLOSED: ['Connection dropped', 'Cuttle closed the connection before answering.', true],
        ERR_EMPTY_RESPONSE: ['No answer', 'Cuttle closed the connection without sending anything, often while it restarts.', true],
        ERR_CONNECTION_TIMED_OUT: ['Can’t reach Cuttle', 'No answer from {host}. Check that the PC is on and on the same network.', true],
        ERR_TIMED_OUT: ['Can’t reach Cuttle', 'No answer from {host} in time.', true],
        ERR_ADDRESS_UNREACHABLE: ['Can’t reach Cuttle', '{host} isn’t reachable from this device. Check Wi-Fi or Tailscale.', true],
        ERR_NETWORK_CHANGED: ['Network changed', 'Your network changed mid-load.', true],
        ERR_INTERNET_DISCONNECTED: ['You’re offline', 'This device has no network connection.', true],
        ERR_NAME_NOT_RESOLVED: ['Unknown address', '{host} couldn’t be found. Check the server address.', false],
        ERR_TOO_MANY_REDIRECTS: ['Redirect loop', 'The address kept redirecting. Clear this site’s cookies or check the server address and HTTP/HTTPS setting.', false],
        ERR_SSL_PROTOCOL_ERROR: ['Secure connection failed', 'HTTPS didn’t work with {host}. Check whether the server uses HTTP or HTTPS.', false],
        ERR_CERT_AUTHORITY_INVALID: ['Certificate not trusted', 'The certificate at {host} isn’t trusted on this device.', false],
        ERR_CERT_COMMON_NAME_INVALID: ['Certificate mismatch', 'The certificate at {host} is for a different address.', false],
        ERR_FAILED: ['Couldn’t load Cuttle', 'The page failed to load.', true],
    };

    function readData() {
        var d = null;
        try { d = JSON.parse(($('cuttleErrorData').textContent || 'null').replace(/\/\*[\s\S]*?\*\/\s*$/, '')); } catch (_) {}
        if (d && typeof d === 'object') return d;
        var q = new URLSearchParams(location.search);
        var out = {};
        q.forEach(function (v, k) { out[k] = v; });
        return out;
    }

    var d = readData();
    var platform = d.platform || (location.protocol === 'file:' ? 'electron' : 'server');
    var isNet = d.kind === 'network';
    var netName = String(d.code || '').replace(/^net::/i, '').trim().toUpperCase();
    var status = parseInt(d.status, 10) || 0;
    var targetUrl = d.url || '';
    var host = d.host || '';
    if (!host && targetUrl) { try { host = new URL(targetUrl).host; } catch (_) {} }
    var path = d.path || '';

    function fill(s) {
        return String(s || '')
            .replace('{path}', path ? '\u0000' : 'this address')
            .replace('{host}', host ? '\u0001' : 'the Cuttle server');
    }
    function setLead(text) {
        // Insert path / host as <code> without trusting any HTML.
        var lead = $('errLead');
        lead.textContent = '';
        String(text).split(/(\u0000|\u0001)/).forEach(function (part) {
            if (part === '\u0000' || part === '\u0001') {
                var c = document.createElement('code');
                c.textContent = part === '\u0000' ? path : host;
                lead.appendChild(c);
            } else if (part) {
                lead.appendChild(document.createTextNode(part));
            }
        });
    }

    var title, lead, retryable;
    if (isNet) {
        var n = NET[netName] || (/^ERR_CERT_/.test(netName) ? NET.ERR_CERT_AUTHORITY_INVALID : null);
        title = n ? n[0] : 'Couldn’t load Cuttle';
        lead = d.message || (n ? n[1] : 'The page failed to load.');
        retryable = n ? n[2] : true;
        if (!n && !netName) title = 'Can\u2019t reach Cuttle';
        $('errCode').textContent = netName || 'Offline';
        $('errCode').classList.add('is-text');
    } else {
        var h = HTTP[status] || [d.name || 'Error', d.message || 'Cuttle couldn’t show this page.'];
        title = h[0];
        lead = h[1];
        retryable = status >= 500 || status === 408 || status === 429;
        $('errCode').textContent = status ? String(status) : '!';
    }
    $('errTitle').textContent = title;
    setLead(fill(lead));
    document.title = (isNet ? netName || 'Offline' : status || 'Error') + ' · ' + title + ' · Cuttle';

    // ── Details ──
    var rows = [];
    function row(k, v) { if (v != null && String(v) !== '') rows.push([k, String(v)]); }
    if (isNet) { row('Error', netName); row('Code', d.errno); row('Address', targetUrl || host); row('Attempt', d.attempt); }
    else { row('Status', status + (d.name ? ' ' + d.name : '')); row('Request', ((d.method || 'GET') + ' ' + path).trim()); row('Request id', d.request_id); if (d.message && HTTP[status]) row('Server says', d.message); }
    row('Client', platform);
    row('Time', d.time || new Date().toISOString());
    var list = $('errList');
    rows.forEach(function (r) {
        var dt = document.createElement('dt'); dt.textContent = r[0];
        var dd = document.createElement('dd'); dd.textContent = r[1];
        list.append(dt, dd);
    });
    $('errCopy').addEventListener('click', function () {
        var text = title + '\n' + rows.map(function (r) { return r[0] + ': ' + r[1]; }).join('\n');
        var done = function () { $('errCopy').textContent = 'Copied'; };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () {});
    });

    // ── Actions ──
    var native = window.CuttleShellNative;
    var inPane = false;
    try { inPane = window.parent && window.parent !== window; } catch (_) {}

    function retry() {
        if (platform === 'android' && native && native.reload) return native.reload();
        if (isNet && targetUrl) {
            // The client counts failures and passes ?attempt= back for backoff.
            location.href = targetUrl;
            return;
        }
        location.reload();
    }
    function home() {
        if (inPane) {
            try { window.parent.postMessage({ type: 'cuttle-navigate', page: '/chat_page.html' }, location.origin); return; } catch (_) {}
        }
        location.href = '/';
    }
    var actions = $('errActions');
    function add(label, fn, primary) {
        var b = document.createElement('button');
        b.type = 'button'; b.textContent = label;
        if (primary) b.className = 'primary';
        b.addEventListener('click', fn);
        actions.appendChild(b);
        return b;
    }
    if (isNet) {
        add('Retry', retry, true);
        if (platform === 'android' && native && native.openSettings) add('Server settings', function () { native.openSettings(); });
    } else {
        if (retryable) add('Retry', retry, true);
        if (history.length > 1) add('Back', function () { history.back(); }, !retryable);
        add('Open chat', home, !retryable && history.length <= 1);
    }

    // ── Auto-retry with backoff (connection-type failures only) ──
    if (isNet && retryable) {
        var attempt = parseInt(d.attempt, 10) || 0;
        var delays = [5, 10, 20, 30, 60];
        var left = delays[Math.min(attempt, delays.length - 1)];
        var note = $('errRetry');
        var tick = function () {
            if (document.hidden) return; // pause while not visible
            left -= 1;
            if (left <= 0) { note.textContent = 'Retrying…'; clearInterval(timer); retry(); return; }
            note.textContent = 'Retrying in ' + left + 's';
        };
        note.textContent = 'Retrying in ' + left + 's';
        var timer = setInterval(tick, 1000);
    }

    $('errFoot').textContent = isNet
        ? (platform === 'electron' ? 'The Cuttle tray icon can start or restart the server.'
            : platform === 'android' ? 'Make sure Cuttle is running on your PC.' : '')
        : 'Cuttle';
})();
</script>
</body>
</html>
