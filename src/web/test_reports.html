<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Test Reports - Cuttle</title>
    <link rel="stylesheet" href="/css/ui_boot.css?v=20260927blendTarget">
    <script src="/js/ui_boot.js?v=20260926safeArea"></script>
    <link rel="stylesheet" href="/css/shared_navigation.css?v=20260926lightBg">
    <style>
        /* Test reports specific styles */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .page-header {
            text-align: center;
            padding: 40px 30px;
            background: var(--header-bg);
            color: var(--text-inverse);
            margin-bottom: 30px;
            border-radius: 20px 20px 0 0;
        }
        
        .page-header h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            /* Default (light mode) - dark gradient */
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .dark-mode .page-header h1,
        .midnight-mode .page-header h1 {
            /* Dark/Midnight mode - light gradient */
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
        }
        
        .page-header h1 .emoji {
            -webkit-text-fill-color: initial;
            background: none;
            -webkit-background-clip: initial;
            background-clip: initial;
        }
        
        .page-header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .search-section {
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px var(--card-shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        
        .search-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: white;
            color: var(--text-primary);
            font-size: 16px;
        }
        
        .dark-mode .search-input,
        .midnight-mode .search-input {
            background: var(--bg-tertiary);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }
        
        .filter-select {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: white;
            color: var(--text-primary);
            font-size: 16px;
            min-width: 150px;
        }
        
        .dark-mode .filter-select,
        .midnight-mode .filter-select {
            background: var(--bg-tertiary);
        }
        
        .search-btn {
            background: var(--accent-color);
            color: var(--text-inverse);
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .search-btn:hover {
            background: var(--accent-hover);
        }
        
        .clear-btn {
            background: var(--text-secondary);
            color: var(--text-inverse);
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .clear-btn:hover {
            background: var(--text-primary);
        }
        
        .results-section {
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px var(--card-shadow);
            border: 1px solid var(--border-color);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .results-count {
            color: var(--text-secondary);
            font-size: 1.1em;
        }
        
        .sort-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .sort-select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: white;
            color: var(--text-primary);
        }
        
        .dark-mode .sort-select,
        .midnight-mode .sort-select {
            background: var(--bg-tertiary);
        }
        
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .report-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .dark-mode .report-card,
        .midnight-mode .report-card {
            background: var(--bg-tertiary);
        }
        
        .report-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 32px var(--card-shadow);
        }
        
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .report-title {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--accent-color);
            margin: 0;
        }
        
        .report-date {
            color: var(--text-secondary);
            font-size: 0.9em;
            white-space: nowrap;
        }
        
        .report-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .meta-item {
            display: flex;
            flex-direction: column;
        }
        
        .meta-label {
            font-size: 0.8em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .meta-value {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .test-status {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: 600;
            text-align: center;
        }
        
        .test-status.pass {
            background: #22C55E;
            color: white;
        }
        
        .test-status.fail {
            background: #F43F5E;
            color: white;
        }
        
        .test-status.warning {
            background: #F59E0B;
            color: white;
        }
        
        .report-preview {
            color: var(--text-secondary);
            font-size: 0.9em;
            line-height: 1.4;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .report-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .view-btn {
            background: var(--accent-color);
            color: var(--text-inverse);
        }
        
        .view-btn:hover {
            background: var(--accent-hover);
        }
        
        .download-btn {
            background: var(--text-secondary);
            color: var(--text-inverse);
        }
        
        .download-btn:hover {
            background: var(--text-primary);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--accent-color);
            font-size: 1.2em;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 1.1em;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }
        
        .page-btn {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: white;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .dark-mode .page-btn,
        .midnight-mode .page-btn {
            background: var(--bg-tertiary);
        }
        
        .page-btn:hover {
            background: var(--accent-color);
            color: var(--text-inverse);
            border-color: var(--accent-color);
        }
        
        .page-btn.active {
            background: var(--accent-color);
            color: var(--text-inverse);
            border-color: var(--accent-color);
        }
        
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .search-controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-input {
                min-width: auto;
            }
            
            .reports-grid {
                grid-template-columns: 1fr;
            }
            
            .results-header {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

                <button class="menu-toggle" onclick="toggleMenu()">
                    <span class="menu-icon">☰</span>
                </button>
            </div>

    </header>

    <!-- Menu Dropdown -->
    <div class="menu-dropdown" id="menuDropdown">
        <div class="menu-section-title">Navigation</div>
        <a href="/" class="menu-item"><span class="emoji">🏠</span> Home</a>
        <a href="/router_editor.html" class="menu-item"><span class="emoji">🔗</span> Router</a>
        <div class="menu-separator"></div>
        <div class="menu-section-title">Reports</div>
        <a href="/test_reports.html" class="menu-item active"><span class="emoji">🧪</span> Test Reports</a>

    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <h1><span class="emoji">🧪</span> Test Reports</h1>
            <div class="subtitle">System validation, test results, and performance analysis</div>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-controls">
                <input type="text" class="search-input" id="searchInput" placeholder="Search test reports by content, date, or test name...">
                <select class="filter-select" id="dateFilter">
                    <option value="">All Time</option>
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                    <option value="year">This Year</option>
                </select>
                <select class="filter-select" id="statusFilter">
                    <option value="">All Status</option>
                    <option value="pass">Passed</option>
                    <option value="fail">Failed</option>
                    <option value="warning">Warning</option>
                </select>
                <button class="search-btn" onclick="searchReports()">🔍 Search</button>
                <button class="clear-btn" onclick="clearSearch()">🗑️ Clear</button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section">
            <div class="results-header">
                <div class="results-count" id="resultsCount">Loading test reports...</div>
                <div class="sort-controls">
                    <label for="sortSelect">Sort by:</label>
                    <select class="sort-select" id="sortSelect" onchange="sortReports()">
                        <option value="date-desc">Date (Newest First)</option>
                        <option value="date-asc">Date (Oldest First)</option>
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="status">Status</option>
                    </select>
                </div>
            </div>
            
            <div id="reportsContainer">
                <div class="loading">🔄 Loading test reports...</div>
            </div>
            
            <div class="pagination" id="pagination" style="display: none;">
                <!-- Pagination buttons will be generated here -->
            </div>
        </div>
    </div>

    <script src="/js/background_effect_blend.js"></script>
    <script src="/js/shared_navigation.js"></script>
    <script>
        // Global state
        let allReports = [];
        let filteredReports = [];
        let currentReportPage = 1;
        const reportsPerPage = 12;

        // Initialize theme and load reports
        document.addEventListener('DOMContentLoaded', function() {
            if (window.initializeTheme) {
                window.initializeTheme();
            }
            loadReports();
            
            // Add enter key support for search
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchReports();
                }
            });
        });

        async function loadReports() {
            try {
                const response = await fetch('/api/test-reports');
                const data = await response.json();
                
                if (data.success) {
                    allReports = data.reports || [];
                    filteredReports = [...allReports];
                    displayReports();
                    updateResultsCount();
                } else {
                    showError('Failed to load test reports: ' + data.error);
                }
            } catch (error) {
                console.error('Error loading test reports:', error);
                showError('Network error loading test reports');
            }
        }

        function displayReports() {
            const container = document.getElementById('reportsContainer');
            const startIndex = (currentReportPage - 1) * reportsPerPage;
            const endIndex = startIndex + reportsPerPage;
            const pageReports = filteredReports.slice(startIndex, endIndex);

            if (pageReports.length === 0) {
                container.innerHTML = '<div class="no-results">No test reports found matching your criteria.</div>';
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            const reportsHTML = pageReports.map(report => `
                <div class="report-card" onclick="openReport('${report.filename}')">
                    <div class="report-header">
                        <h3 class="report-title">${report.title || report.filename}</h3>
                        <div class="report-date">${formatDate(report.date)}</div>
                    </div>
                    <div class="report-meta">
                        <div class="meta-item">
                            <div class="meta-label">Status</div>
                            <div class="test-status ${getTestStatus(report)}">${getTestStatusText(report)}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Size</div>
                            <div class="meta-value">${formatFileSize(report.size)}</div>
                        </div>
                    </div>
                    <div class="report-preview">
                        ${report.preview || 'No preview available'}
                    </div>
                    <div class="report-actions">
                        <a href="/logs/${report.filename}" target="_blank" class="action-btn view-btn" onclick="event.stopPropagation()">
                            👁️ View
                        </a>
                        <a href="/logs/${report.filename}" download class="action-btn download-btn" onclick="event.stopPropagation()">
                            ⬇️ Download
                        </a>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="reports-grid">${reportsHTML}</div>`;
            updatePagination();
        }

        function searchReports() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const dateFilter = document.getElementById('dateFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            filteredReports = allReports.filter(report => {
                // Text search
                const matchesSearch = !searchTerm || 
                    report.filename.toLowerCase().includes(searchTerm) ||
                    (report.title && report.title.toLowerCase().includes(searchTerm)) ||
                    (report.preview && report.preview.toLowerCase().includes(searchTerm));

                // Date filter
                const matchesDate = !dateFilter || matchesDateFilter(report.date, dateFilter);

                // Status filter
                const matchesStatus = !statusFilter || getTestStatus(report) === statusFilter;

                return matchesSearch && matchesDate && matchesStatus;
            });

            currentReportPage = 1;
            displayReports();
            updateResultsCount();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('dateFilter').value = '';
            document.getElementById('statusFilter').value = '';
            filteredReports = [...allReports];
            currentReportPage = 1;
            displayReports();
            updateResultsCount();
        }

        function sortReports() {
            const sortBy = document.getElementById('sortSelect').value;
            
            filteredReports.sort((a, b) => {
                switch (sortBy) {
                    case 'date-desc':
                        return new Date(b.date) - new Date(a.date);
                    case 'date-asc':
                        return new Date(a.date) - new Date(b.date);
                    case 'name-asc':
                        return a.filename.localeCompare(b.filename);
                    case 'name-desc':
                        return b.filename.localeCompare(a.filename);
                    case 'status':
                        return getTestStatus(a).localeCompare(getTestStatus(b));
                    default:
                        return 0;
                }
            });

            currentReportPage = 1;
            displayReports();
        }

        function updateResultsCount() {
            const count = filteredReports.length;
            const total = allReports.length;
            document.getElementById('resultsCount').textContent = 
                `Showing ${count} of ${total} test reports`;
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredReports.length / reportsPerPage);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }

            pagination.style.display = 'flex';
            
            let paginationHTML = '';
            
            // Previous button
            paginationHTML += `
                <button class="page-btn" ${currentReportPage === 1 ? 'disabled' : ''} 
                        onclick="changePage(${currentReportPage - 1})">
                    ← Previous
                </button>
            `;
            
            // Page numbers
            const startPage = Math.max(1, currentReportPage - 2);
            const endPage = Math.min(totalPages, currentReportPage + 2);
            
            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <button class="page-btn ${i === currentReportPage ? 'active' : ''}" 
                            onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }
            
            // Next button
            paginationHTML += `
                <button class="page-btn" ${currentReportPage === totalPages ? 'disabled' : ''} 
                        onclick="changePage(${currentReportPage + 1})">
                    Next →
                </button>
            `;
            
            pagination.innerHTML = paginationHTML;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredReports.length / reportsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentReportPage = page;
                displayReports();
            }
        }

        function openReport(filename) {
            window.open(`/logs/${filename}`, '_blank');
        }

        function formatDate(dateString) {
            if (!dateString) return 'Unknown';
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function formatFileSize(bytes) {
            if (!bytes) return 'Unknown';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }

        function getTestStatus(report) {
            const preview = report.preview || '';
            if (preview.includes('passed') || preview.includes('success')) return 'pass';
            if (preview.includes('failed') || preview.includes('error')) return 'fail';
            if (preview.includes('warning')) return 'warning';
            return 'pass'; // Default to pass if unclear
        }

        function getTestStatusText(report) {
            const status = getTestStatus(report);
            switch (status) {
                case 'pass': return 'PASS';
                case 'fail': return 'FAIL';
                case 'warning': return 'WARN';
                default: return 'UNKNOWN';
            }
        }

        function matchesDateFilter(dateString, filter) {
            if (!dateString) return false;
            const date = new Date(dateString);
            const now = new Date();
            
            switch (filter) {
                case 'today':
                    return date.toDateString() === now.toDateString();
                case 'week':
                    const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    return date >= weekAgo;
                case 'month':
                    const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                    return date >= monthAgo;
                case 'year':
                    const yearAgo = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
                    return date >= yearAgo;
                default:
                    return true;
            }
        }

        function showError(message) {
            document.getElementById('reportsContainer').innerHTML = 
                `<div class="no-results">❌ ${message}</div>`;
        }

        // Admin functions
        function shutdownBot() {
            if (confirm('Are you sure you want to shutdown the Cuttle bot? This will stop all services.')) {
                // Close menu first
                const menuDropdown = document.getElementById('menuDropdown');
                if (menuDropdown) {
                    menuDropdown.classList.remove('active');
                }
                
                // Show loading state
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = '🔄 Shutting down...';
                button.disabled = true;
                
                // Make API call to shutdown
                fetch('/api/shutdown', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        button.textContent = '✅ Shutdown complete';
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 2000);
                    } else {
                        button.textContent = '❌ Shutdown failed';
                        button.disabled = false;
                        setTimeout(() => {
                            button.textContent = originalText;
                        }, 3000);
                    }
                })
                .catch(error => {
                    console.error('Shutdown error:', error);
                    button.textContent = '❌ Shutdown failed';
                    button.disabled = false;
                    setTimeout(() => {
                        button.textContent = originalText;
                    }, 3000);
                });
            }
        }
        
        function restartBot() {
            if (confirm('Are you sure you want to restart the Cuttle bot? This will restart all services.')) {
                // Close menu first
                const menuDropdown = document.getElementById('menuDropdown');
                if (menuDropdown) {
                    menuDropdown.classList.remove('active');
                }
                
                // Show loading state
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = '🔄 Restarting...';
                button.disabled = true;
                
                // Make API call to restart
                fetch('/api/restart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        button.textContent = '✅ Restart complete';
                        setTimeout(() => {
                            window.location.reload();
                        }, 2000);
                    } else {
                        button.textContent = '❌ Restart failed';
                        button.disabled = false;
                        setTimeout(() => {
                            button.textContent = originalText;
                        }, 3000);
                    }
                })
                .catch(error => {
                    console.error('Restart error:', error);
                    button.textContent = '❌ Restart failed';
                    button.disabled = false;
                    setTimeout(() => {
                        button.textContent = originalText;
                    }, 3000);
                });
            }
        }
    </script>
</body>
</html>
