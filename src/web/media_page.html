<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/img/cuttle-mascot_square.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media - Cuttle</title>
    <link rel="stylesheet" href="/css/ui_boot.css?v=20261114kbBack">
    <script src="/js/shared/ui_boot.js?v=20261114kbBack"></script>
    <link rel="stylesheet" href="/css/shared_navigation.css?v=20260926lightBg">
    <link rel="stylesheet" href="/css/landing_page.css?v=20261028gpuBg">
    <link rel="stylesheet" href="/css/compact_page.css?v=20261015glass">
    <link rel="stylesheet" href="/css/auth_modal.css?v=20260926authLogin">
    <link rel="stylesheet" href="/css/searchable_select.css?v=20261011attachedMenus">
    <link rel="stylesheet" href="/css/page_controls.css?v=20261015glass">
    <link rel="stylesheet" href="/css/chat_lightbox.css?v=20260922imgCtxMenu">
    <link rel="stylesheet" href="/css/media_page.css?v=20261117media1">
</head>
<body class="compact-shell-page" data-page="media">
    <main class="media-page cuttle-page">
        <header class="compact-page-title has-actions">
            <div class="compact-page-heading">
                <h1>Media</h1>
                <p>Images and videos shared in your chats, by you and your agents.</p>
            </div>
            <div class="compact-page-actions">
                <button id="mediaRefresh" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6M20 4v7h-7"/></svg><span class="desktop-label">Refresh</span></button>
            </div>
        </header>

        <section class="media-toolbar" id="mediaToolbar" aria-label="Filter and sort media" hidden>
            <div class="media-toolbar-row">
                <input id="mediaSearch" type="search" placeholder="Search names, captions, chats, projects" aria-label="Search media" autocomplete="off">
                <div class="media-seg" role="radiogroup" aria-label="Type" data-pref="kind">
                    <button type="button" role="radio" data-value="all">All <span data-count="all"></span></button>
                    <button type="button" role="radio" data-value="image">Images <span data-count="image"></span></button>
                    <button type="button" role="radio" data-value="video">Videos <span data-count="video"></span></button>
                </div>
            </div>
            <div class="media-toolbar-row media-toolbar-selects">
                <label>From
                    <select id="mediaSource" data-pref="source" aria-label="From">
                        <option value="all">Everyone</option>
                        <option value="mine">You (uploads)</option>
                        <option value="agents">Agents</option>
                    </select>
                </label>
                <label>Chat
                    <select id="mediaChat" data-pref="chat" aria-label="Chat"></select>
                </label>
                <label>Project
                    <select id="mediaProject" data-pref="project" aria-label="Project"></select>
                </label>
                <label>When
                    <select id="mediaRange" data-pref="range" aria-label="When"></select>
                </label>
                <label>Sort
                    <select id="mediaSort" data-pref="sort" aria-label="Sort"></select>
                </label>
                <label>Group
                    <select id="mediaGroup" data-pref="group" aria-label="Group">
                        <option value="none">None</option>
                        <option value="day">Day</option>
                        <option value="chat">Chat</option>
                        <option value="project">Project</option>
                    </select>
                </label>
            </div>
            <div class="media-toolbar-row media-toolbar-foot">
                <label class="media-check"><input type="checkbox" id="mediaShowExpired" data-pref="showExpired"> Show expired</label>
                <label class="media-check"><input type="checkbox" id="mediaShowArchived" data-pref="showArchived"> Archived chats</label>
                <button type="button" id="mediaClear" class="media-link-btn" hidden>Clear filters</button>
                <span class="media-grow"></span>
                <span class="media-summary" id="mediaSummary" aria-live="polite"></span>
                <div class="media-seg media-seg--icons" role="radiogroup" aria-label="Tile size" data-pref="size">
                    <button type="button" role="radio" data-value="small" aria-label="Small tiles" title="Small tiles"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="16" y="9.5" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.5" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg></button>
                    <button type="button" role="radio" data-value="medium" aria-label="Medium tiles" title="Medium tiles"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button>
                    <button type="button" role="radio" data-value="large" aria-label="Large tiles" title="Large tiles"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="18" height="8" rx="1.5"/><rect x="3" y="13" width="18" height="8" rx="1.5"/></svg></button>
                </div>
            </div>
        </section>

        <section id="mediaNotice" class="media-notice" role="status" aria-live="polite">Loading media…</section>
        <section id="mediaGrid" class="media-groups" data-size="medium" hidden></section>
        <div id="mediaMore" class="media-more" hidden></div>
    </main>
    <script src="/js/shared/shared_navigation.js"></script>
    <script src="/js/shared/toast.js"></script>
    <script src="/js/shared/searchable_select.js?v=20261011attachedMenus"></script>
    <script src="/js/shared/page_controls.js?v=20261011pageControls2"></script>
    <script src="/js/chat/chat_media.js?v=20261117mediaApp"></script>
    <script src="/js/media_library/media_library_model.js?v=20261117media1"></script>
    <script src="/js/media_library/media_library_page.js?v=20261117media1"></script>
</body>
</html>
