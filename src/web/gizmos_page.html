<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizmos - Cuttle</title>
    <link rel="stylesheet" href="/css/ui_boot.css?v=20260927blendTarget">
    <script src="/js/shared/ui_boot.js?v=20260926safeArea"></script>
    <link rel="stylesheet" href="/css/shared_navigation.css?v=20260926lightBg">
    <link rel="stylesheet" href="/css/landing_page.css?v=20261028gpuBg">
    <link rel="stylesheet" href="/css/compact_page.css?v=20261015glass">
    <link rel="stylesheet" href="/css/gizmos.css?v=20261015gzTokens">
    <link rel="stylesheet" href="/css/gizmos_page.css?v=20261015gzTokens">
<script defer src="/js/shared/searchable_select.js?v=20261011attachedMenus"></script>
<link rel="stylesheet" href="/css/searchable_select.css?v=20261011attachedMenus">
<link rel="stylesheet" href="/css/page_controls.css?v=20261015glass">
<script defer src="/js/shared/page_controls.js?v=20261011pageControls2"></script>
</head>
<body class="compact-shell-page" data-page="gizmos">
    <main class="gizmos-page cuttle-page">
        <header class="gizmos-header compact-page-title has-actions">
            <div class="compact-page-heading">
                <h1>Gizmos</h1>
                <p>Live meters you can pin, float over Spaces, or pop out to the desktop.</p>
            </div>
            <div class="gizmos-controls compact-page-actions">
                <button id="refreshGizmos" type="button">Refresh</button>
                <a href="/settings_page.html?tab=experimental">Experimental settings</a>
            </div>
        </header>
        <p id="gizmosStatus" class="gizmos-status" role="status" aria-live="polite">Loading gizmos…</p>

        <section id="gizmosCreate" class="gizmos-create" hidden>
            <h2>Add a gizmo</h2>
            <form id="gizmosCreateForm" class="gizmos-form">
                <label><span>Type</span><select id="gizmoCreateType" name="type"></select></label>
                <label><span>Agent</span><select id="gizmoCreateAgent" name="agent"></select></label>
                <label><span>Place on</span><select id="gizmoCreateDock" name="dock"></select></label>
                <label><span>Title</span><input id="gizmoCreateTitle" name="title" maxlength="60" placeholder="Default: “Codex usage”"></label>
                <button type="submit" class="gizmos-primary">Add gizmo</button>
            </form>
        </section>

        <section id="gizmosList" class="gizmos-list" aria-label="Your gizmos"></section>
        <p class="gizmos-footnote">Tasks gizmos live above each chat composer. Agents create and update them during work. Existing lists stay available even when usage meters are disabled.</p>
    </main>
    <script src="/js/shared/shared_navigation.js"></script>
    <script src="/js/shared/toast.js"></script>
    <script src="/js/gizmos/gizmos_model.js?v=20261006gizmos1"></script>
    <script src="/js/shared/scroll_preserve.js?v=20261028poll"></script>
    <script src="/js/gizmos/gizmos_page.js?v=20261028poll"></script>
</body>
</html>
