<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboards - Cuttle</title>
    <link rel="stylesheet" href="/css/ui_boot.css?v=20260927blendTarget">
    <script src="/js/ui_boot.js?v=20260926safeArea"></script>
    <link rel="stylesheet" href="css/shared_navigation.css?v=20260926lightBg">
    <link rel="stylesheet" href="css/landing_page.css?v=20260926lightBg">
    <link rel="stylesheet" href="css/compact_page.css?v=20260917bgFix2">
    <link rel="stylesheet" href="css/dashboards_page.css?v=20260928menu1">
</head>
<body class="compact-shell-page" data-page="dashboards">
    <script>
        (function () {
            if (window.CuttleUiBoot) return;
            var t = localStorage.getItem('theme') || 'dark';
            document.body.classList.remove('dark-mode', 'midnight-mode', 'light-mode');
            document.body.classList.add(t === 'light' ? 'light-mode' : (t === 'midnight' ? 'midnight-mode' : 'dark-mode'));
        })();
    </script>
    <div class="dash-page" id="dashRoot">
        <p class="dash-loading">Loading dashboards…</p>
    </div>
    <script src="/js/optional_cdn.js?v=20260926cdnQueue"></script>
    <script src="/js/dashboards_page.js?v=20260928usage2"></script>
</body>
</html>
