<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Lab - Cuttle</title>
    <link rel="stylesheet" href="/css/ui_boot.css?v=20260927blendTarget">
    <script src="/js/shared/ui_boot.js?v=20260926safeArea"></script>
    <link rel="stylesheet" href="/css/shared_navigation.css?v=20260926lightBg">
    <link rel="stylesheet" href="/css/landing_page.css?v=20260926lightBg">
    <link rel="stylesheet" href="/css/compact_page.css?v=20261007hdr2">
    <link rel="stylesheet" href="/css/test_lab_page.css?v=20261011testLab1">
</head>
<body class="compact-shell-page" data-page="test-lab">
    <main class="test-lab-page cuttle-page">
        <header class="test-lab-header compact-page-title has-actions">
            <div class="compact-page-heading">
                <h1>Test Lab</h1>
                <p>Test suite health across your registered projects.</p>
            </div>
            <div class="test-lab-controls compact-page-actions">
                <label class="test-lab-project-label" for="testLabProject">Project</label>
                <select id="testLabProject" aria-label="Select project" disabled>
                    <option>Loading projects…</option>
                </select>
                <button id="refreshTestLab" type="button" disabled>Refresh</button>
                <button id="runAllTests" type="button" class="test-lab-primary" disabled>Run all tests</button>
            </div>
        </header>

        <section id="testLabNotice" class="test-lab-notice" role="status" aria-live="polite" hidden></section>
        <section id="testLabContent" hidden>
            <div class="test-lab-overview" id="testLabOverview"></div>
            <section class="test-lab-section" aria-labelledby="testLabSuitesTitle">
                <div class="test-lab-section-heading">
                    <div><h2 id="testLabSuitesTitle">Test suites</h2><p>Runs execute locally on this Cuttle host and may modify project files.</p></div>
                    <span id="testLabScanStatus" class="test-lab-muted"></span>
                </div>
                <div class="test-lab-suites" id="testLabSuites"></div>
            </section>
            <section class="test-lab-section" aria-labelledby="testLabHistoryTitle">
                <div class="test-lab-section-heading">
                    <div><h2 id="testLabHistoryTitle">Recent runs</h2><p>Results are saved on this Cuttle host.</p></div>
                </div>
                <div class="test-lab-history" id="testLabHistory"></div>
            </section>
            <section class="test-lab-output-section" id="testLabOutputSection" hidden aria-labelledby="testLabOutputTitle">
                <div class="test-lab-section-heading">
                    <div><h2 id="testLabOutputTitle">Run output</h2><p id="testLabOutputMeta"></p></div>
                    <button type="button" id="closeTestLabOutput" aria-label="Close output">Close</button>
                </div>
                <pre id="testLabOutput"></pre>
            </section>
        </section>
    </main>
    <script src="/js/shared/shared_navigation.js"></script>
    <script src="/js/shared/toast.js"></script>
    <script src="/js/test_lab/test_lab_page.js?v=20261011testLab1"></script>
</body>
</html>
