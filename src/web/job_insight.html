<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Insight - Cuttle</title>
    <link rel="stylesheet" href="/css/ui_boot.css?v=20260927blendTarget">
    <script src="/js/ui_boot.js?v=20260926safeArea"></script>
    <link rel="stylesheet" href="css/shared_navigation.css?v=20260926lightBg">
    <link rel="stylesheet" href="css/chat_page.css">
    <style>
        .job-insight { display: flex; flex-direction: column; height: 100vh; background: var(--bg-primary); }
        .job-insight-header {
            flex-shrink: 0; padding: 16px 24px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 16px; background: var(--bg-secondary);
        }
        .job-insight-back {
            color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; gap: 6px;
            font-size: 14px; transition: color 0.2s;
        }
        .job-insight-back:hover { color: var(--accent-color); }
        .job-insight-title { font-size: 1.25rem; font-weight: 600; }
        .job-insight-desc { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .widget-row {
            flex-shrink: 0; display: flex; gap: 16px; padding: 16px 24px; flex-wrap: wrap;
            background: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
        }
        .widget {
            min-width: 140px; padding: 12px 16px; border-radius: 10px;
            background: var(--bg-tertiary); border: 1px solid var(--border-color);
        }
        .widget-label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 4px; }
        .widget-value { font-size: 1.1rem; font-weight: 600; }
        .widget-value.running { color: #4ade80; }
        .widget-value.stopped { color: var(--text-secondary); }
        .job-insight-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
        .job-insight-actions .btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; }
        .job-insight-actions .btn-run-now { background: var(--accent-color); color: var(--text-inverse, #fff); }
        .job-insight-actions .btn-start { background: #22c55e; color: #fff; }
        .job-insight-actions .btn-stop { background: #ef4444; color: #fff; }
        .schedule-toggle { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; }
        .schedule-toggle .tag { padding: 2px 8px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .schedule-toggle .tag.on { background: rgba(74, 222, 128, 0.2); color: #4ade80; }
        .schedule-toggle .tag.off { background: rgba(100, 116, 139, 0.3); color: #94a3b8; }
        .schedule-next { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
        .feed-container {
            flex: 1; overflow-y: auto; padding: 20px 24px; max-width: 900px; margin: 0 auto; width: 100%;
        }
        .feed-section { margin-bottom: 24px; }
        .feed-section-title { font-size: 12px; color: var(--text-tertiary); margin-bottom: 12px; text-transform: uppercase; }
        .execution-card {
            background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px;
            margin-bottom: 16px; overflow: hidden;
        }
        .execution-card.failed { border-left: 4px solid #f87171; }
        .execution-card.success { border-left: 4px solid #4ade80; }
        .execution-card.pending {
            border-left: 4px solid #7c3aed;
            animation: insightCardFlow 2.8s ease-in-out infinite;
        }
        @keyframes insightCardFlow {
            0%, 100% { box-shadow: 0 0 0 1px rgba(124, 58, 237, 0.15), 0 4px 18px rgba(124, 58, 237, 0.06); }
            50% { box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.25), 0 8px 28px rgba(124, 58, 237, 0.14); }
        }
        .insight-status-live {
            display: inline-flex; align-items: center; gap: 8px; font-weight: 600;
            background: linear-gradient(90deg, #a78bfa, #22d3ee, #c084fc, #a78bfa);
            background-size: 220% auto; -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: insightTextFlow 4s linear infinite;
        }
        @keyframes insightTextFlow { to { background-position: 220% center; } }
        .insight-flow-dot {
            width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #06b6d4);
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.7);
            animation: insightDotPulse 1.1s ease-in-out infinite;
            -webkit-text-fill-color: initial;
        }
        @keyframes insightDotPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: 0.75; } }
        .live-stages-slot { min-height: 32px; font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .live-stages-slot .mini-row {
            padding: 6px 10px; margin-bottom: 6px; border-radius: 8px; background: var(--bg-tertiary);
            border-left: 3px solid #7c3aed; animation: miniRowIn 0.35s ease-out;
        }
        .live-stages-slot .mini-row.tool { border-left-color: #fbbf24; }
        .live-stages-slot .mini-row.llm { border-left-color: #c084fc; }
        @keyframes miniRowIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
        .live-hint { font-size: 11px; color: var(--text-tertiary); margin-top: 10px; }
        .execution-header {
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid transparent; cursor: pointer; gap: 10px;
        }
        .execution-header:hover { background: var(--bg-hover); }
        .execution-card.expanded .execution-header { border-bottom-color: var(--border-color); }
        .execution-toggle-icon {
            flex-shrink: 0; font-size: 10px; color: var(--text-tertiary); width: 1em;
            transition: transform 0.15s ease;
        }
        .execution-card.expanded .execution-toggle-icon { transform: rotate(90deg); }
        .execution-meta { font-size: 12px; color: var(--text-secondary); }
        .execution-body { display: none; padding: 16px; }
        .execution-card.expanded .execution-body { display: block; }
        .log-entry {
            padding: 10px 12px; margin-bottom: 8px; border-radius: 8px; font-size: 13px;
            background: var(--bg-tertiary); border-left: 3px solid var(--accent-color);
        }
        .log-entry.type-input { border-left-color: #60a5fa; }
        .log-entry.type-output { border-left-color: #4ade80; }
        .log-entry.type-llm { border-left-color: #c084fc; }
        .log-entry.type-tool { border-left-color: #fbbf24; }
        .log-entry.type-error { border-left-color: #f87171; }
        .log-entry-name { font-weight: 600; margin-bottom: 4px; color: var(--text-primary); }
        .log-entry-detail { font-size: 12px; color: var(--text-secondary); }
        .log-entry-preview { font-size: 12px; margin-top: 6px; color: var(--text-tertiary); max-height: 80px; overflow: hidden; text-overflow: ellipsis; }
        .query-id-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--accent-color); color: white; font-size: 11px; font-weight: 600; margin-left: 8px; }
        .report-link { color: var(--accent-color); text-decoration: none; font-size: 12px; margin-left: 8px; white-space: nowrap; }
        .report-link:hover { text-decoration: underline; }
        .execution-loading, .execution-empty { text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="job-insight">
        <header class="job-insight-header">
            <a href="/jobs_page.html" class="job-insight-back">← Jobs</a>
            <div>
                <h1 class="job-insight-title" id="pipelineTitle">—</h1>
                <p class="job-insight-desc" id="pipelineDesc"></p>
            </div>
        </header>
        <div class="widget-row">
            <div class="widget">
                <div class="widget-label">Status</div>
                <div class="widget-value" id="widgetStatus">—</div>
            </div>
            <div class="widget">
                <div class="widget-label">Schedule</div>
                <div class="widget-value" id="widgetSchedule">—</div>
                <div class="schedule-next" id="widgetScheduleNext"></div>
                <div id="widgetScheduleToggles"></div>
            </div>
            <div class="widget">
                <div class="widget-label">Executions</div>
                <div class="widget-value" id="widgetExecutions">—</div>
            </div>
            <div class="widget">
                <div class="widget-label">Recent Cost</div>
                <div class="widget-value" id="widgetCost">—</div>
            </div>
        </div>
        <div class="job-insight-actions" id="jobInsightActions"></div>
        <div class="feed-container" id="feedContainer">
            <div class="execution-loading" id="feedLoading">Loading...</div>
        </div>
    </div>
    <script src="/js/toast.js"></script>
    <script src="/js/cron_countdown.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const pipelineName = params.get('pipeline') || '';

        function scheduleNextInsightLoad() {
            clearTimeout(window._insightPollT);
            const hasPending = document.querySelector('.execution-card.pending');
            const ms = hasPending ? 4000 : 14000;
            window._insightPollT = setTimeout(function () { loadInsight(); }, ms);
        }

        async function loadInsight() {
            if (!pipelineName) {
                window._lastInsightExecsJson = null;
                document.getElementById('feedContainer').innerHTML = '<div class="execution-empty">No pipeline specified. <a href="/jobs_page.html">Browse jobs</a></div>';
                return;
            }
            document.getElementById('pipelineTitle').textContent = pipelineName;
            try {
                const r = await fetch('/api/job-insight?pipeline=' + encodeURIComponent(pipelineName) + '&limit=50');
                if (!r.ok) throw new Error('Failed to load');
                const d = await r.json();
                if (d.error) throw new Error(d.error);
                renderInsight(d);
            } catch (e) {
                window._lastInsightExecsJson = null;
                document.getElementById('feedContainer').innerHTML = '<div class="execution-empty">' + (e.message || e) + '</div>';
            }
            scheduleNextInsightLoad();
        }

        function collectExpandedExecKeys() {
            const keys = new Set();
            document.querySelectorAll('#feedContainer .execution-card.expanded').forEach(function (card) {
                const qid = card.getAttribute('data-query-id');
                if (qid) keys.add('q:' + qid);
                else {
                    const ts = card.getAttribute('data-exec-ts');
                    if (ts) keys.add('t:' + ts);
                }
            });
            return keys;
        }

        function applyExpandedExecKeys(keys) {
            if (!keys || !keys.size) return;
            document.querySelectorAll('#feedContainer .execution-card').forEach(function (card) {
                const qid = card.getAttribute('data-query-id');
                const ts = card.getAttribute('data-exec-ts');
                if (qid && keys.has('q:' + qid)) card.classList.add('expanded');
                else if (ts && keys.has('t:' + ts)) card.classList.add('expanded');
            });
        }

        function updateInsightWidgets(d) {
            insightSchedules = d.schedules || [];
            document.getElementById('pipelineDesc').textContent = d.description || '';
            document.getElementById('widgetStatus').textContent = d.is_running ? '● Listening' : '○ Stopped';
            document.getElementById('widgetStatus').className = 'widget-value ' + (d.is_running ? 'running' : 'stopped');
            const schedules = d.schedules || [];
            const sched = schedules[0];
            document.getElementById('widgetSchedule').textContent = sched ? formatCron(sched.cron) : (schedules.length ? '—' : '—');
            updateScheduleCountdown(schedules);
            const togglesEl = document.getElementById('widgetScheduleToggles');
            togglesEl.innerHTML = schedules.map(sc => {
                const enc = (pipelineName || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                return `<div class="schedule-toggle">${formatCron(sc.cron)}
                    <span class="tag ${sc.enabled ? 'on' : 'off'}" onclick="toggleSchedule('${enc}', ${sc.node_id}, ${!sc.enabled})">${sc.enabled ? 'On' : 'Off'}</span>
                </div>`;
            }).join('');

            const actionsEl = document.getElementById('jobInsightActions');
            const enc = (pipelineName || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            actionsEl.innerHTML = `
                <button class="btn btn-run-now" onclick="runNow('${enc}')">▶ Run Now</button>
                ${d.is_running
                    ? `<button class="btn btn-stop" onclick="stopJob('${enc}')">⏹ Stop</button>`
                    : `<button class="btn btn-start" onclick="startJob('${enc}')">▶ Start</button>`
                }
            `;

            document.getElementById('widgetExecutions').textContent = (d.executions || []).length;
            const totalCost = (d.executions || []).reduce((s, e) => s + (e.total_cost || 0), 0);
            document.getElementById('widgetCost').textContent = totalCost > 0 ? '$' + totalCost.toFixed(4) : '—';
        }

        function renderInsight(d) {
            updateInsightWidgets(d);
            const feed = document.getElementById('feedContainer');
            const execs = d.executions || [];
            const execsJson = JSON.stringify(execs);
            const hadStableFeed = !!(feed.querySelector('.execution-card') || feed.querySelector('.execution-empty'));
            if (execsJson === window._lastInsightExecsJson && hadStableFeed) {
                wirePendingLiveUpdates();
                return;
            }
            window._lastInsightExecsJson = execsJson;

            const expandedKeys = collectExpandedExecKeys();
            if (!execs.length) {
                feed.innerHTML = '<div class="execution-empty">No executions yet for this pipeline.</div>';
                wirePendingLiveUpdates();
                return;
            }
            feed.innerHTML = execs.map(exec => renderExecution(exec)).join('');
            applyExpandedExecKeys(expandedKeys);
            wirePendingLiveUpdates();
        }

        function wirePendingLiveUpdates() {
            clearInterval(window._insightLiveIv);
            window._insightLiveIv = null;
            const cards = document.querySelectorAll('.execution-card.pending[data-query-id]');
            if (!cards.length) return;
            async function tick() {
                for (const card of cards) {
                    const qid = card.getAttribute('data-query-id');
                    const slot = card.querySelector('.live-stages-slot');
                    if (!slot || !qid) continue;
                    try {
                        const r = await fetch('/api/query-live-status?query_id=' + encodeURIComponent(qid));
                        const j = await r.json();
                        if (!j.executing) {
                            loadInsight();
                            return;
                        }
                        let h = '';
                        (j.stages || []).slice(-10).forEach(function (s) {
                            const t = (s.type || 'stage').toLowerCase();
                            const rowCls = t.indexOf('tool') >= 0 ? 'mini-row tool' : (t.indexOf('llm') >= 0 ? 'mini-row llm' : 'mini-row');
                            const mark = s.success === false ? '✗ ' : '✓ ';
                            const det = typeof s.details === 'string' ? s.details : (s.details && (s.details.details || s.details.error)) || '';
                            h += '<div class="' + rowCls + '">' + mark + escapeHtml(s.name || '') +
                                '<div style="opacity:.75;font-size:11px;margin-top:2px;">' + escapeHtml(det) + '</div></div>';
                        });
                        (j.llm_calls || []).slice(-6).forEach(function (c) {
                            const ok = c.success !== false;
                            const rowCls = ok ? 'mini-row llm' : 'mini-row llm';
                            const mark = ok ? '✓ ' : '✗ ';
                            const tail = (c.notes || '').slice(0, 120);
                            h += '<div class="' + rowCls + '">' + mark + 'LLM ' + escapeHtml(c.model || '') +
                                (ok ? '' : ' <span style="color:#f87171;font-weight:600">failed</span>') +
                                '<div style="opacity:.75;font-size:11px;margin-top:2px;">' + escapeHtml(tail) + '</div></div>';
                        });
                        slot.innerHTML = h || '<em style="opacity:.6">Starting…</em>';
                    } catch (err) { /* ignore */ }
                }
            }
            tick();
            window._insightLiveIv = setInterval(tick, 2800);
        }

        async function runNow(name) {
            try {
                const webChatSessionId = (typeof localStorage !== 'undefined' && localStorage.getItem('lastChatSessionId')) || '';
                const r = await fetch('/api/pipeline-run-now', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pipelineName: name, webChatSessionId }) });
                const ct = r.headers.get('content-type') || '';
                let data;
                if (ct.includes('application/json')) {
                    data = await r.json();
                } else {
                    (window.showToast || alert)('Server returned ' + r.status + '. Restart Cuttle daemon if you just updated.', 'error');
                    return;
                }
                if (data.success) {
                    if (data.pending && data.report_url) {
                        (window.showToast || alert)('Run started — live report updating', 'info', { linkUrl: data.report_url, linkText: 'Open live report' });
                    } else {
                        const opts = data.report_url ? { linkUrl: data.report_url, linkText: 'View query log' } : {};
                        (window.showToast || alert)('Ran successfully', 'success', opts);
                    }
                    await loadInsight();
                } else (window.showToast || alert)(data.error || 'Failed', 'error');
            } catch (e) { (window.showToast || alert)('Error: ' + e.message, 'error'); }
        }
        async function startJob(name) {
            try {
                const r = await fetch('/api/pipeline-start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pipelineName: name }) });
                const data = await r.json();
                if (data.success) (window.showToast || alert)('Started', 'success');
                else (window.showToast || alert)(data.error || 'Failed', 'error');
                loadInsight();
            } catch (e) { (window.showToast || alert)('Error: ' + e.message, 'error'); }
        }
        async function stopJob(name) {
            try {
                const r = await fetch('/api/pipeline-stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pipelineName: name }) });
                const data = await r.json();
                if (data.success) (window.showToast || alert)('Stopped', 'success');
                else (window.showToast || alert)(data.error || 'Failed', 'error');
                loadInsight();
            } catch (e) { (window.showToast || alert)('Error: ' + e.message, 'error'); }
        }
        async function toggleSchedule(pipelineName, nodeId, newEnabled) {
            try {
                const r = await fetch('/api/pipeline-schedule-toggle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pipelineName, nodeId, enabled: newEnabled }) });
                const data = await r.json();
                if (data.success) { (window.showToast || alert)(data.message, 'success'); loadInsight(); }
                else (window.showToast || alert)(data.error || 'Failed', 'error');
            } catch (e) { (window.showToast || alert)('Error: ' + e.message, 'error'); }
        }

        function formatCron(c) {
            if (!c) return '—';
            const p = c.trim().split(/\s+/);
            if (p[0] === '*') return 'every minute';
            if (p[0].startsWith('*/')) return 'every ' + p[0].slice(2) + ' min';
            if (p.length >= 2 && p[1].startsWith('*/')) return 'every ' + p[1].slice(2) + ' hrs';
            return c;
        }

        function updateScheduleCountdown(schedules) {
            const el = document.getElementById('widgetScheduleNext');
            if (!el || !window.CronCountdown) return;
            if (!schedules || schedules.length === 0) { el.textContent = ''; return; }
            let soonest = null;
            schedules.filter(function (sc) { return sc.enabled && sc.cron; }).forEach(function (sc) {
                const next = window.CronCountdown.getNextCronRun(sc.cron);
                if (next && (!soonest || next.getTime() < soonest.getTime())) soonest = next;
            });
            el.textContent = soonest ? 'Next ' + window.CronCountdown.formatCountdown(soonest) : '';
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString();
        }

        function stageDetailText(s) {
            const d = s && s.details;
            if (d == null || d === '') return '';
            if (typeof d === 'string') return d;
            if (typeof d === 'object') {
                const bits = [d.details, d.error, d.message].filter(Boolean);
                if (bits.length) return String(bits[0]);
                try { return JSON.stringify(d); } catch (e) { return String(d); }
            }
            return String(d);
        }

        function formatStageDuration(dur) {
            if (typeof dur !== 'number' || !isFinite(dur)) return '';
            return dur.toFixed(2) + 's';
        }

        function toggleExecutionCard(header) {
            const card = header.closest('.execution-card');
            if (card) card.classList.toggle('expanded');
        }

        function renderExecution(exec) {
            const isPending = !!exec.pending;
            const cls = isPending ? 'pending' : (exec.success ? 'success' : 'failed');
            const statusLabel = isPending
                ? '<span class="insight-status-live"><span class="insight-flow-dot" aria-hidden="true"></span> Running…</span>'
                : (exec.success
                    ? '<span style="color:#4ade80;font-weight:600;">Success</span>'
                    : '<span style="color:#f87171;font-weight:600;">Failed</span>');
            const stages = exec.execution_stages || [];
            const llms = exec.llm_calls || [];
            const tools = exec.tool_calls || [];
            let bodyHtml = '';
            const errMsg = exec.error_message != null && String(exec.error_message).trim() ? String(exec.error_message).trim() : '';
            if (errMsg && !isPending) {
                bodyHtml += `<div class="log-entry type-error"><div class="log-entry-name">Run error</div><div class="log-entry-detail">${escapeHtml(errMsg)}</div></div>`;
            }
            stages.forEach(s => {
                const typ = s.type || 'stage';
                const entryCls = s.success === false ? 'error' : typ;
                const det = stageDetailText(s);
                const durStr = formatStageDuration(s.duration);
                bodyHtml += `<div class="log-entry type-${entryCls}">
                    <div class="log-entry-name">${s.success === false ? '✗ ' : ''}${escapeHtml(s.name || s.type || 'Stage')}</div>
                    <div class="log-entry-detail">${escapeHtml(det)}${det && durStr ? ' · ' : ''}${durStr}</div>
                </div>`;
            });
            llms.forEach(l => {
                const failed = l.success === false;
                const entryCls = failed ? 'error' : 'llm';
                const costNum = typeof l.cost === 'number' && isFinite(l.cost) ? l.cost : 0;
                const prev = l.response_preview ? String(l.response_preview) : '';
                const prevHtml = prev
                    ? `<div class="log-entry-preview">${escapeHtml(prev.length > 220 ? prev.slice(0, 220) + '…' : prev)}</div>`
                    : '';
                bodyHtml += `<div class="log-entry type-${entryCls}">
                    <div class="log-entry-name">🤖 ${escapeHtml(l.model || 'LLM')}${failed ? ' <span style="color:#f87171;font-weight:600">failed</span>' : ''}</div>
                    <div class="log-entry-detail">${failed ? 'No completion · ' : ''}${(l.total_tokens || 0)} tokens · $${costNum.toFixed(4)}${l.notes ? ' · ' + escapeHtml(l.notes) : ''}</div>
                    ${prevHtml}
                </div>`;
            });
            tools.forEach(t => {
                bodyHtml += `<div class="log-entry type-tool">
                    <div class="log-entry-name">🔧 ${escapeHtml(t.tool_name || t.name || 'Tool')}</div>
                    <div class="log-entry-detail">${escapeHtml((t.input_preview || '').slice(0, 100))}</div>
                </div>`;
            });
            if (!bodyHtml && !isPending) bodyHtml = '<div class="log-entry"><div class="log-entry-detail">No stages recorded</div></div>';
            const reportFn = exec.report_filename || (exec.query_id ? ('query_report_' + exec.query_id + '.html') : '');
            const reportLink = reportFn
                ? `<a href="/logs/${escapeHtml(reportFn)}" target="_blank" class="report-link" onclick="event.stopPropagation()">${isPending ? '📊 Live report' : '📊 View Query Report'}</a>`
                : '';
            const queryIdBlock = exec.query_id
                ? `<span class="query-id-badge" title="Query ID">${escapeHtml(exec.query_id)}</span>`
                : '';
            const dataQid = exec.query_id ? ` data-query-id="${escapeHtml(exec.query_id)}"` : '';
            const execTs = exec.timestamp != null ? String(exec.timestamp) : '';
            const dataExecTs = execTs ? ` data-exec-ts="${escapeHtml(execTs)}"` : '';
            const liveBlock = isPending
                ? '<div class="live-stages-slot"></div><p class="live-hint">Stages stream here while the run is in progress. Open the live report for the full view.</p>'
                : '';
            const execTime = typeof exec.execution_time === 'number' && isFinite(exec.execution_time) ? exec.execution_time : null;
            const totalCost = typeof exec.total_cost === 'number' && isFinite(exec.total_cost) ? exec.total_cost : 0;
            const timeCost = isPending
                ? '<span class="execution-meta">…</span>'
                : `<span class="execution-meta">${execTime != null ? execTime.toFixed(1) + 's' : ''} · $${totalCost.toFixed(4)} ${reportLink}</span>`;
            return `
                <div class="execution-card ${cls}"${dataQid}${dataExecTs}>
                    <div class="execution-header" onclick="toggleExecutionCard(this)" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleExecutionCard(this);}">
                        <span class="execution-toggle-icon" aria-hidden="true">▶</span>
                        <span class="execution-meta" style="flex:1;min-width:0;">${statusLabel} · ${formatTime(exec.timestamp)} ${queryIdBlock}</span>
                        ${isPending ? `<span class="execution-meta">${reportLink}</span>` : timeCost}
                    </div>
                    <div class="execution-body">
                        ${exec.user_input ? `<div class="log-entry type-input"><div class="log-entry-name">Input</div><div class="log-entry-detail">${escapeHtml(exec.user_input)}</div></div>` : ''}
                        ${liveBlock}
                        ${bodyHtml}
                    </div>
                </div>`;
        }

        function escapeHtml(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        loadInsight();
        let insightSchedules = [];
        setInterval(function () {
            if (window.CronCountdown && insightSchedules.length) {
                updateScheduleCountdown(insightSchedules);
            }
        }, 1000);
    </script>
</body>
</html>
