<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Feed · Cuttle</title><link rel="stylesheet" href="/css/ui_boot.css"><script src="/js/shared/ui_boot.js"></script>
<link rel="stylesheet" href="/css/shared_navigation.css"><link rel="stylesheet" href="/css/compact_page.css?v=20261007hdr2"><link rel="stylesheet" href="/css/query_log_inspector.css"><link rel="stylesheet" href="/css/agent_feed.css?v=20261007hdr2"></head>
<body class="compact-shell-page" data-page="agent-feed"><main class="agent-feed cuttle-page">
<header class="feed-header compact-page-title has-actions"><div class="compact-page-heading"><h1>Agent Feed<span class="feed-live-dot" aria-hidden="true"></span></h1><p>Every step. One place.</p></div><div class="compact-page-actions"><a class="feed-settings" href="/settings_page.html?tab=data" aria-label="Database settings">Storage ↗</a></div></header>
<form id="feedFilters" class="feed-controls">
<div class="feed-toolbar"><label class="feed-search"><span class="sr-only">Search activity</span><input name="search" type="search" placeholder="Search activity…"></label>
<label><span class="sr-only">Step type</span><select name="kind" class="setting-input"><option value="">All steps</option><option>tool</option><option>edit</option><option>thinking</option><option>writing</option><option>run.start</option><option>run.resume</option><option>finish</option><option>status</option><option value="failure">Failures</option></select></label>
<button id="feedFollow" type="button" aria-pressed="true">Following live</button></div>
<div class="feed-filter-line"><details class="feed-advanced"><summary>Filters <span id="feedFilterCount"></span></summary><div class="feed-advanced-fields"><label>Agent<input name="agent" placeholder="All agents"></label><label>Model<input name="model" placeholder="All models"></label><label>Chat<input name="chat" placeholder="CH-001066"></label><label>Project<input name="project" placeholder="All projects"></label><button type="submit">Apply filters</button></div></details><p id="feedStatus" role="status" aria-live="polite">Connecting…</p></div>
</form>
<section id="feedRows" aria-label="Agent steps"></section><footer class="feed-footer"><span>Latest activity first</span><button id="feedOlder" type="button">Older steps ↓</button></footer>
</main><script src="/js/agent_events/diff.js"></script><script src="/js/agent_events/feed_model.js"></script><script src="/js/agent_events/feed_page.js?v=4"></script></body></html>
