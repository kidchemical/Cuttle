<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizmo - Cuttle</title>
    <link rel="stylesheet" href="/css/gizmos.css?v=20261006gizmos1">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; color: #c9d1d9; }
        body { -webkit-app-region: drag; app-region: drag; user-select: none; }
        #gizmoPopout { height: 100%; }
        .popout-actions { position: fixed; top: 4px; right: 4px; display: flex; gap: 2px; opacity: 0; transition: opacity .15s ease; -webkit-app-region: no-drag; app-region: no-drag; }
        body:hover .popout-actions { opacity: 1; }
        .popout-actions button { width: 20px; height: 20px; padding: 0; border: none; border-radius: 4px; background: rgba(255,255,255,.08); color: #c9d1d9; font: 12px/20px system-ui, sans-serif; cursor: pointer; }
        .popout-actions button:hover { background: rgba(255,255,255,.18); }
        .popout-message { padding: 10px; font: 12px system-ui, sans-serif; color: #8b949e; }
        .gizmo--popout .gizmo-head { padding-right: 46px; }
    </style>
</head>
<body>
    <div id="gizmoPopout"><div class="popout-message">Loading…</div></div>
    <div class="popout-actions">
        <button type="button" id="popoutRefresh" title="Refresh now" aria-label="Refresh now">↻</button>
        <button type="button" id="popoutDockBack" title="Return to the Cuttle window" aria-label="Return to the Cuttle window">✕</button>
    </div>
    <script src="/js/gizmos/gizmos_model.js?v=20261006gizmos1"></script>
    <script src="/js/gizmos/gizmo_popout.js?v=20261006gizmos1"></script>
</body>
</html>
