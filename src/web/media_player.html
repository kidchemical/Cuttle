<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media - Cuttle</title>
    <link rel="stylesheet" href="/css/ui_boot.css?v=20260926safeArea">
    <script src="/js/ui_boot.js?v=20260926safeArea"></script>
    <link rel="stylesheet" href="css/shared_navigation.css?v=20260926lightBg">
    <link rel="stylesheet" href="css/media_player.css">
</head>
<body>
    <div class="media-player-page">
        <header class="media-player-chrome">
            <button type="button" class="media-player-back" id="mediaBack" title="Back to feed">← Back</button>
            <h1 class="media-player-title" id="mediaTitle">Media</h1>
            <div class="media-player-actions">
                <button type="button" class="media-player-btn" id="mediaUnmute" hidden>Unmute</button>
                <a class="media-player-link" id="mediaExternal" href="#" target="_blank" rel="noopener" hidden>Open link</a>
            </div>
        </header>
        <p class="media-player-hint" id="mediaHint" hidden></p>
    </div>
    <script src="/js/media_player.js"></script>
</body>
</html>
