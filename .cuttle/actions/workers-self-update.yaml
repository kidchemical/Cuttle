name: workers.self-update
title: Client self-update
description: >-
  Ask a Client worker (client daemon) to git pull --ff-only and restart
  Electron + client daemon. Params: target (worker_id), repo?, no_electron?, no_daemon?
type: shell
run: powershell -NoProfile -ExecutionPolicy Bypass -File .cuttle\scripts\workers-cli.ps1 self-update
run_posix: .venv/bin/python -m api.device_workers.cli self-update
workdir: .
timeout: 60
