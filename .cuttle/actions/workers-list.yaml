name: workers.list
title: List device workers
description: >-
  List LAN device workers (online status, capabilities). Agent-agnostic mesh verb.
  Optional params: online_only=true
type: shell
run: powershell -NoProfile -ExecutionPolicy Bypass -File .cuttle\scripts\workers-cli.ps1 list
run_posix: .venv/bin/python -m api.device_workers.cli list
workdir: .
timeout: 60
