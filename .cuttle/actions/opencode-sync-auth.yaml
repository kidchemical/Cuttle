name: opencode.sync-auth
title: Sync API key → OpenCode
description: >-
  Copy a provider API key from Cuttle (process env / src/.env) into OpenCode's
  auth.json and optionally pin the default model. The key never appears in chat.
  Params: provider = openai | anthropic | openrouter | both | all | status
  (default openai); pin_model = true|false (default true).
type: shell
run: .venv\Scripts\python.exe .cuttle\scripts\opencode_sync_auth.py
run_posix: .venv/bin/python .cuttle/scripts/opencode_sync_auth.py
workdir: .
