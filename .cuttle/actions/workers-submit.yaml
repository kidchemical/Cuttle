name: workers.submit
title: Submit mesh job
description: >-
  Submit a device-worker job (ping | file_copy | blender_render).
  Params: type, params (JSON) or source/dest / blend_file/output_dir/frame_*,
  target (worker_id), submitted_by, priority, requirements_json.
type: shell
run: powershell -NoProfile -ExecutionPolicy Bypass -File .cuttle\scripts\workers-cli.ps1 submit
run_posix: .venv/bin/python -m api.device_workers.cli submit
workdir: .
timeout: 60
