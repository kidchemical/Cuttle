name: git.push
title: Push to git remote
description: >-
  Push the current branch after the user clicks this card. Agents must never
  run git push from the shell in Cuttle chat. Params: mode = status | push
  (default push); remote; branch; path (project cwd, optional).
  Never force-pushes.
type: shell
run: powershell -NoProfile -ExecutionPolicy Bypass -File .cuttle\scripts\git-push.ps1
run_posix: .venv/bin/python .cuttle/scripts/git-push.py
workdir: .
timeout: 120
